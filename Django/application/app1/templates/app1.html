{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Image Gallery - App1</title>
        <meta name="description" content="Discover amazing images">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="{% static 'app1/style.css' %}">
    </head>
    <body>
        <div class="navbar">
            <h1 class="logo">📸 Image Gallery</h1>
            <div class="stats">
                <span>Total Likes: <strong id="totalLikes">0</strong></span>
            </div>
        </div>
        
        <div class="gallery">
            <div class="image-card">
                <img src="{% static 'istockphoto-155439315-1024x1024.jpg' %}" alt="Image 1">
                <div class="card-footer">
                    <button class="like-btn" onclick="toggleLike(this)">
                        <i class="far fa-thumbs-up"></i> <span class="like-count">0</span>
                    </button>
                    <button class="dislike-btn" onclick="toggleDislike(this)">
                        <i class="far fa-thumbs-down"></i> <span class="dislike-count">0</span>
                    </button>
                </div>
            </div>
            
            <div class="image-card">
                <img src="{% static 'istockphoto-530741074-1024x1024.jpg' %}" alt="Image 2">
                <div class="card-footer">
                    <button class="like-btn" onclick="toggleLike(this)">
                        <i class="far fa-thumbs-up"></i> <span class="like-count">0</span>
                    </button>
                    <button class="dislike-btn" onclick="toggleDislike(this)">
                        <i class="far fa-thumbs-down"></i> <span class="dislike-count">0</span>
                    </button>
                </div>
            </div>
            
            <div class="image-card">
                <img src="{% static 'istockphoto-583809524-1024x1024.jpg' %}" alt="Image 3">
                <div class="card-footer">
                    <button class="like-btn" onclick="toggleLike(this)">
                        <i class="far fa-thumbs-up"></i> <span class="like-count">0</span>
                    </button>
                    <button class="dislike-btn" onclick="toggleDislike(this)">
                        <i class="far fa-thumbs-down"></i> <span class="dislike-count">0</span>
                    </button>
                </div>
            </div>
        </div>
        
        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2025 Image Gallery App 1 | Showcasing Beautiful Images</p>
                <div class="footer-icons">
                    <i class="fas fa-heart"></i>
                    <i class="fas fa-images"></i>
                    <i class="fas fa-star"></i>
                </div>
            </div>
        </footer>
        
        <script>
            function toggleLike(btn) {
                const isActive = btn.classList.toggle('active');
                const likeCount = btn.querySelector('.like-count');
                let count = parseInt(likeCount.textContent);
                likeCount.textContent = isActive ? count + 1 : count - 1;
                updateTotalLikes();
            }
            
            function toggleDislike(btn) {
                const isActive = btn.classList.toggle('active');
                const dislikeCount = btn.querySelector('.dislike-count');
                let count = parseInt(dislikeCount.textContent);
                dislikeCount.textContent = isActive ? count + 1 : count - 1;
            }
            
            function updateTotalLikes() {
                const allLikeButtons = document.querySelectorAll('.like-btn.active');
                document.getElementById('totalLikes').textContent = allLikeButtons.length;
            }
        </script>
    </body>
</html>
