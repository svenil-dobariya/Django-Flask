<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Calculator</title>
        <meta name="description" content="Simple calculator application">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    </head>
    <body>
        <div class="main-wrapper">
            <div class="calculator-container">
                <h1>Calculator</h1>
                <form id="calculatorForm">
                    <div class="form-group">
                        <label for="num1">First Number</label>
                        <input type="number" id="num1" name="num1" required step="any" placeholder="Enter first number">
                    </div>
                    
                    <div class="form-group">
                        <label for="num2">Second Number</label>
                        <input type="number" id="num2" name="num2" required step="any" placeholder="Enter second number">
                    </div>
                    
                    <fieldset>
                        <legend style="margin-bottom: 15px; color: #555; font-weight: 500;">Operation</legend>
                        <div class="operation-group">
                            <label class="operation-option">
                                <input type="radio" name="operation" value="add" required>
                                <span>Add</span>
                            </label>
                            <label class="operation-option">
                                <input type="radio" name="operation" value="subtract">
                                <span>Subtract</span>
                            </label>
                            <label class="operation-option">
                                <input type="radio" name="operation" value="multiply">
                                <span>Multiply</span>
                            </label>
                            <label class="operation-option">
                                <input type="radio" name="operation" value="divide">
                                <span>Divide</span>
                            </label>
                        </div>
                    </fieldset>
                    
                    <button type="submit">Calculate</button>
                </form>

                <div id="errorMessage" class="error-message"></div>
                
                <div id="resultContainer" class="result-container">
                    <div class="result-label">Result:</div>
                    <div id="resultValue" class="result-value"></div>
                </div>
                
                <div class="back-link">
                    <a href="/">Back to Home</a>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="canvas3d"></canvas>
            </div>
        </div>

       
        <script src="{{ url_for('static', filename='js/index.js') }}"></script>
    </body>
</html>
